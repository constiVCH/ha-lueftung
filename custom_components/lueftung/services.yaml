set_mode:
  name: Lüftungsbereich Modus setzen
  description: Setzt den Modus eines Lüftungsbereichs direkt über die API.
  fields:
    area_id:
      name: Bereich
      description: Bereichsnummer (1-6)
      required: true
      selector:
        number:
          min: 1
          max: 6
          mode: box
    mode:
      name: Modus
      description: Lüftungsmodus
      required: true
      selector:
        select:
          options:
            - "Fans off"
            - "Manual 1"
            - "Manual 2"
            - "Manual 3"
            - "Manual 4"
            - "Manual 5"
            - "Manual 6"
            - "Boost ventilation"
            - "Humidity regulation"
            - "CO2 regulation"
            - "Timed program"
            - "Snooze"
            - "INACTIVE"
