blueprint:
  name: "Lüftung – Bereichssteuerung"
  description: >
    Steuert einen einzelnen Lüftungsbereich basierend auf dem Vergleich von
    Innen- und Außensensoren. Der Nachtmodus hat globalen Vorrang.
  domain: automation
  input:
    mode_selector:
      name: Modus-Schalter für diesen Bereich
      description: >
        input_select mit den Optionen: Aus, Temperatursteuerung, Feuchtigkeitssteuerung.
      selector:
        entity:
          domain: input_select

    night_switch:
      name: Globaler Nachtmodus-Schalter
      selector:
        entity:
          domain: input_boolean

    area_id:
      name: Bereichsnummer (1–6)
      selector:
        number:
          min: 1
          max: 6
          mode: box

    # ── TEMPERATUR ──
    temp_sensor_indoor:
      name: Temperatursensor Innen
      selector:
        entity:
          domain: sensor
          device_class: temperature

    temp_sensor_outdoor:
      name: Temperatursensor Außen
      selector:
        entity:
          domain: sensor
          device_class: temperature

    temp_condition:
      name: Lüfter an wenn es draußen…
      default: "colder"
      selector:
        select:
          options:
            - label: "…kälter ist als innen (Kühlen – frische Luft rein)"
              value: "colder"
            - label: "…wärmer ist als innen"
              value: "warmer"

    temp_diff_threshold:
      name: Mindest-Temperaturdifferenz (°C)
      description: Lüfter schaltet erst ab dieser Differenz zwischen Innen und Außen
      default: 2
      selector:
        number:
          min: 0
          max: 20
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider

    temp_active_mode:
      name: Lüftungsstufe Temperatur aktiv
      default: "Manual 3"
      selector:
        select:
          options:
            - "Manual 1"
            - "Manual 2"
            - "Manual 3"
            - "Manual 4"
            - "Manual 5"
            - "Manual 6"
            - "Boost ventilation"

    # ── FEUCHTIGKEIT ──
    humid_sensor_indoor:
      name: Feuchtigkeitssensor Innen
      selector:
        entity:
          domain: sensor
          device_class: humidity

    humid_sensor_outdoor:
      name: Feuchtigkeitssensor Außen
      selector:
        entity:
          domain: sensor
          device_class: humidity

    humid_diff_threshold:
      name: Mindest-Feuchtigkeitsdifferenz (%)
      description: Lüfter schaltet wenn es draußen um diesen Wert trockener ist als innen
      default: 5
      selector:
        number:
          min: 0
          max: 50
          step: 1
          unit_of_measurement: "%"
          mode: slider

    humid_active_mode:
      name: Lüftungsstufe Feuchtigkeit aktiv
      default: "Manual 3"
      selector:
        select:
          options:
            - "Manual 1"
            - "Manual 2"
            - "Manual 3"
            - "Manual 4"
            - "Manual 5"
            - "Manual 6"
            - "Humidity regulation"
            - "Boost ventilation"

    # ── ALLGEMEIN ──
    inactive_mode:
      name: Lüftungsstufe wenn inaktiv
      default: "Fans off"
      selector:
        select:
          options:
            - "Fans off"
            - "Manual 1"
            - "Manual 2"
            - "Manual 3"

    night_mode:
      name: Nacht-Lüftungsstufe
      description: Hat Vorrang vor allen anderen Modi
      default: "Manual 1"
      selector:
        select:
          options:
            - "Fans off"
            - "Manual 1"
            - "Manual 2"
            - "Manual 3"

variables:
  mode_selector: !input mode_selector
  night_switch: !input night_switch
  area_id: !input area_id
  temp_sensor_indoor: !input temp_sensor_indoor
  temp_sensor_outdoor: !input temp_sensor_outdoor
  temp_condition: !input temp_condition
  temp_diff_threshold: !input temp_diff_threshold
  temp_active_mode: !input temp_active_mode
  humid_sensor_indoor: !input humid_sensor_indoor
  humid_sensor_outdoor: !input humid_sensor_outdoor
  humid_diff_threshold: !input humid_diff_threshold
  humid_active_mode: !input humid_active_mode
  inactive_mode: !input inactive_mode
  night_mode: !input night_mode

trigger:
  - platform: state
    entity_id: !input mode_selector
  - platform: state
    entity_id: !input night_switch
  - platform: state
    entity_id: !input temp_sensor_indoor
  - platform: state
    entity_id: !input temp_sensor_outdoor
  - platform: state
    entity_id: !input humid_sensor_indoor
  - platform: state
    entity_id: !input humid_sensor_outdoor

condition: []

action:
  - variables:
      is_night: "{{ is_state(night_switch, 'on') }}"
      current_mode: "{{ states(mode_selector) }}"

      temp_in: "{{ states(temp_sensor_indoor) | float(0) }}"
      temp_out: "{{ states(temp_sensor_outdoor) | float(0) }}"
      temp_diff: "{{ temp_in - temp_out }}"
      temp_triggered: >
        {% if temp_condition == 'colder' %}
          {{ temp_diff >= temp_diff_threshold }}
        {% else %}
          {{ (temp_out - temp_in) >= temp_diff_threshold }}
        {% endif %}

      humid_in: "{{ states(humid_sensor_indoor) | float(0) }}"
      humid_out: "{{ states(humid_sensor_outdoor) | float(0) }}"
      humid_triggered: "{{ (humid_in - humid_out) >= humid_diff_threshold }}"

      target_mode: >
        {% if is_night %}
          {{ night_mode }}
        {% elif current_mode == 'Temperatursteuerung' %}
          {{ temp_active_mode if temp_triggered else inactive_mode }}
        {% elif current_mode == 'Feuchtigkeitssteuerung' %}
          {{ humid_active_mode if humid_triggered else inactive_mode }}
        {% else %}
          {{ inactive_mode }}
        {% endif %}

  - service: lueftung.set_mode
    data:
      area_id: "{{ area_id | int }}"
      mode: "{{ target_mode }}"

mode: single
max_exceeded: silent
