blueprint:
  name: "Lüftung – Feuchtigkeitssteuerung"
  description: >
    Steuert Lüftungsbereiche basierend auf einem Feuchtigkeitssensor.
    Nur aktiv wenn der Lüftungsmodus-Schalter auf "Feuchtigkeitssteuerung" steht.
  domain: automation
  input:
    mode_selector:
      name: Lüftungsmodus-Schalter
      description: >
        Der input_select der den aktiven Modus steuert.
      selector:
        entity:
          domain: input_select

    humidity_sensor:
      name: Feuchtigkeitssensor
      selector:
        entity:
          domain: sensor
          device_class: humidity

    threshold:
      name: Grenzwert (%)
      default: 65
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    condition:
      name: Bedingung
      default: "above"
      selector:
        select:
          options:
            - label: "Über dem Grenzwert (zu feucht)"
              value: "above"
            - label: "Unter dem Grenzwert (zu trocken)"
              value: "below"

    active_mode:
      name: Lüftungsstufe wenn aktiv
      default: "Manual 3"
      selector:
        select:
          options:
            - "Manual 1"
            - "Manual 2"
            - "Manual 3"
            - "Manual 4"
            - "Manual 5"
            - "Manual 6"
            - "Boost ventilation"
            - "Humidity regulation"

    inactive_mode:
      name: Lüftungsstufe wenn inaktiv
      default: "Fans off"
      selector:
        select:
          options:
            - "Fans off"
            - "Manual 1"
            - "Manual 2"
            - "Manual 3"

    area_1:
      name: Bereich 1 steuern?
      default: false
      selector:
        boolean:
    area_2:
      name: Bereich 2 steuern?
      default: false
      selector:
        boolean:
    area_3:
      name: Bereich 3 steuern?
      default: false
      selector:
        boolean:
    area_4:
      name: Bereich 4 steuern?
      default: false
      selector:
        boolean:
    area_5:
      name: Bereich 5 steuern?
      default: false
      selector:
        boolean:
    area_6:
      name: Bereich 6 steuern?
      default: false
      selector:
        boolean:

variables:
  threshold: !input threshold
  condition: !input condition
  active_mode: !input active_mode
  inactive_mode: !input inactive_mode
  area_1: !input area_1
  area_2: !input area_2
  area_3: !input area_3
  area_4: !input area_4
  area_5: !input area_5
  area_6: !input area_6
  mode_selector: !input mode_selector

trigger:
  - platform: state
    entity_id: !input humidity_sensor
  - platform: state
    entity_id: !input mode_selector

condition:
  - condition: template
    value_template: "{{ states(mode_selector) == 'Feuchtigkeitssteuerung' }}"

action:
  - variables:
      is_triggered: >
        {% set val = states(!input humidity_sensor) | float(0) %}
        {% if condition == 'above' %}
          {{ val > threshold }}
        {% else %}
          {{ val < threshold }}
        {% endif %}
      target_mode: "{{ active_mode if is_triggered else inactive_mode }}"

  - repeat:
      for_each:
        - area: 1
          enabled: "{{ area_1 }}"
        - area: 2
          enabled: "{{ area_2 }}"
        - area: 3
          enabled: "{{ area_3 }}"
        - area: 4
          enabled: "{{ area_4 }}"
        - area: 5
          enabled: "{{ area_5 }}"
        - area: 6
          enabled: "{{ area_6 }}"
      sequence:
        - if:
            - condition: template
              value_template: "{{ repeat.item.enabled }}"
          then:
            - service: lueftung.set_mode
              data:
                area_id: "{{ repeat.item.area }}"
                mode: "{{ target_mode }}"

mode: single
max_exceeded: silent
