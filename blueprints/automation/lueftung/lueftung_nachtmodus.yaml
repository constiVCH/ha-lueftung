blueprint:
  name: "Lüftung – Nachtmodus"
  description: >
    Aktiviert einen ruhigen Lüftungsmodus zur Nachtzeit.
    Nur aktiv wenn der Lüftungsmodus-Schalter auf "Nachtmodus" steht.
  domain: automation
  input:
    mode_selector:
      name: Lüftungsmodus-Schalter
      description: >
        Der input_select der den aktiven Modus steuert.
      selector:
        entity:
          domain: input_select

    night_start:
      name: Nacht beginnt um
      default: "22:00:00"
      selector:
        time:

    night_end:
      name: Nacht endet um
      default: "07:00:00"
      selector:
        time:

    night_mode:
      name: Nacht-Lüftungsstufe
      default: "Manual 1"
      selector:
        select:
          options:
            - "Fans off"
            - "Manual 1"
            - "Manual 2"
            - "Manual 3"

    day_mode:
      name: Tag-Lüftungsstufe (nach der Nacht)
      default: "Fans off"
      selector:
        select:
          options:
            - "Fans off"
            - "Manual 1"
            - "Manual 2"
            - "Manual 3"
            - "Manual 4"
            - "Manual 5"
            - "Manual 6"

    area_1:
      name: Bereich 1 steuern?
      default: false
      selector:
        boolean:
    area_2:
      name: Bereich 2 steuern?
      default: false
      selector:
        boolean:
    area_3:
      name: Bereich 3 steuern?
      default: false
      selector:
        boolean:
    area_4:
      name: Bereich 4 steuern?
      default: false
      selector:
        boolean:
    area_5:
      name: Bereich 5 steuern?
      default: false
      selector:
        boolean:
    area_6:
      name: Bereich 6 steuern?
      default: false
      selector:
        boolean:

variables:
  night_mode: !input night_mode
  day_mode: !input day_mode
  area_1: !input area_1
  area_2: !input area_2
  area_3: !input area_3
  area_4: !input area_4
  area_5: !input area_5
  area_6: !input area_6
  mode_selector: !input mode_selector

trigger:
  - platform: time
    at: !input night_start
    id: "nacht_start"
  - platform: time
    at: !input night_end
    id: "nacht_ende"
  - platform: state
    entity_id: !input mode_selector
    to: "Nachtmodus"
    id: "modus_aktiviert"

condition:
  - condition: template
    value_template: "{{ states(mode_selector) == 'Nachtmodus' }}"

action:
  - variables:
      target_mode: >
        {% if trigger.id == 'nacht_ende' %}
          {{ day_mode }}
        {% else %}
          {{ night_mode }}
        {% endif %}

  - repeat:
      for_each:
        - area: 1
          enabled: "{{ area_1 }}"
        - area: 2
          enabled: "{{ area_2 }}"
        - area: 3
          enabled: "{{ area_3 }}"
        - area: 4
          enabled: "{{ area_4 }}"
        - area: 5
          enabled: "{{ area_5 }}"
        - area: 6
          enabled: "{{ area_6 }}"
      sequence:
        - if:
            - condition: template
              value_template: "{{ repeat.item.enabled }}"
          then:
            - service: lueftung.set_mode
              data:
                area_id: "{{ repeat.item.area }}"
                mode: "{{ target_mode }}"

mode: single
max_exceeded: silent
