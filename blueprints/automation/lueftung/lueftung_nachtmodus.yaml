blueprint:
  name: "Lüftung – Nachtmodus (global)"
  description: >
    Schaltet den globalen Nachtmodus-Schalter automatisch zur eingestellten Uhrzeit
    ein und aus. Die Bereichs-Automationen reagieren darauf automatisch.
  domain: automation
  input:
    night_switch:
      name: Globaler Nachtmodus-Schalter
      description: Derselbe input_boolean wie in den Bereichs-Automationen
      selector:
        entity:
          domain: input_boolean

    night_start:
      name: Nacht beginnt um
      default: "22:00:00"
      selector:
        time:

    night_end:
      name: Nacht endet um
      default: "07:00:00"
      selector:
        time:

trigger:
  - platform: time
    at: !input night_start
    id: "start"
  - platform: time
    at: !input night_end
    id: "ende"

action:
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'start' }}"
    then:
      - service: input_boolean.turn_on
        target:
          entity_id: !input night_switch
    else:
      - service: input_boolean.turn_off
        target:
          entity_id: !input night_switch

mode: single
